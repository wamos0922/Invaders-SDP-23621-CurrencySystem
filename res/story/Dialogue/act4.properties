# Panel 24 - They're Human?!
panel.24.1=Rixley|They're... humans?!
panel.24.2=Dr. Draco|Greetings! I assume you're from Earth.
panel.24.3=Dr. Draco|You can call me Dr. Draco.
panel.24.4=Protagonist|Wait... How did humans get here?
panel.24.5=Dr. Draco|I assume you escaped from Earth and are searching for somewhere safe to live.
panel.24.6=Dr. Draco|Don't worry. You can take off your helmets. The atmosphere here is safe for humans.
panel.24.7=Dr. Draco|My followers and I predicted that artificial intelligence would eventually take over Earth.
panel.24.8=Dr. Draco|We tried warning everyone, but nobody believed us.
panel.24.9=Dr. Draco|So we decided to leave Earth before it was too late and search for a suitable planet to establish a new home.
panel.24.10=Protagonist|So... is this the place where humanity can finally live in peace?

# Panel 25 - The Truth About Planet 3
panel.25.1=Dr. Draco|Unfortunately, this planet is only suitable for us temporarily.
panel.25.2=Dr. Draco|Its temperature has been rising every day, and we still don't fully understand why.
panel.25.3=Dr. Draco|For years, we've been researching which planets would be most suitable for human habitation.
panel.25.4=Dr. Draco|But our results have always pointed to the same answer.
panel.25.5=Dr. Draco|Earth.
panel.25.6=Blorp|What's so special about Earth anyway?
panel.25.7=Dr. Draco|Earth is still our best chance.
panel.25.8=Dr. Draco|That's why we're planning to upgrade our spaceships and prepare for a full-scale war against the AI.
panel.25.9=Dr. Draco|In five months, we'll return to Earth and reclaim our home.
panel.25.10=Dr. Draco|Will you join us?
panel.25.11=Narrator|After a short discussion, we finally reached a decision.
panel.25.12=Protagonist|Count us in!
panel.25.13=Blorp|EXCELLENT! But I demand a bucket full of gold coins after all this!
