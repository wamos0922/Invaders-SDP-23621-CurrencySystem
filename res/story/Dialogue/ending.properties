
# TRUE ENDING - THE LAST SACRIFICE
# After defeating Level 40 final boss

# Panel 28 - We Did It!
panel.28.1=Narrator|WE DID IT!
panel.28.2=Narrator|We finally reclaimed our home!
panel.28.3=Narrator|After everything we've been through, humanity can finally live in peace again!
panel.28.4=Humans|WE DID IT!
panel.28.5=Humans|LONG LIVE HUMANITY!

# Panel 29 - Not Over Yet...
panel.29.1=Narrator|But...
panel.29.2=Narrator|Something was still moving among the ruins.
panel.29.3=Narrator|One of the AI robots had survived.

# Panel 30 - One Last Attack
panel.30.1=Narrator|Before anyone could react, it raised its weapon and fired directly at me!

# Panel 31 - Blorp's Sacrifice
panel.31.1=Narrator|But before the shot could reach me...
panel.31.2=Narrator|Blorp jumped in front of it.
panel.31.3=Narrator|His body absorbed the impact, but the damage was too much.
panel.31.4=Narrator|His body began to fall apart.

# Panel 32 - The Last Goodbye
panel.32.1=Narrator|Another soldier quickly fired at the robot, finally destroying the last remaining AI.
panel.32.2=Narrator|But none of us cared about that anymore.
panel.32.3=Narrator|We gathered around Blorp, hoping there was still something we could do.
panel.32.4=Blorp|Thank you...
panel.32.5=Blorp|For the amazing journey...
panel.32.6=Narrator|And just like that...
panel.32.7=Narrator|Our little friend was gone.

# Panel 33 - Forever Remembered
panel.33.1=Inscription|BLORP
panel.33.2=Inscription|Forever in our hearts. Forever remembered.
panel.33.3=Narrator|Three years have passed since the war.
panel.33.4=Narrator|Human civilization has finally returned to normal.
panel.33.5=Narrator|Dr. Draco is now leading humanity's technological development, making sure that a disaster like this will never happen again.
panel.33.6=Narrator|As for us...
panel.33.7=Narrator|We'll never forget the journey we shared with our little friend.
panel.33.8=Narrator|The End.
