
# ACT 1 - ESCAPE FROM EARTH
# Panels 6-8: After tutorial
# Panels 9-11: After Level 5

# Panel 6 - Finally, Freedom!
panel.6.1=Narrator|Finally! I made it into space!
panel.6.2=Narrator|...
panel.6.3=SFX|DUNG! DUNG! DUNG!
panel.6.4=Narrator|Something fell inside the ship.
panel.6.5=Narrator|I turned around to see what was going on.

# Panel 7 - An Unexpected Passenger
panel.7.1=Protagonist|WHAT?! There's a girl inside my spaceship?!
panel.7.2=Protagonist|Who are you?!
panel.7.3=Rixley|My name is Rixley. I'm an engineer.
panel.7.4=Rixley|I secretly followed you when you escaped. You didn't even notice me!
panel.7.5=Rixley|I've grown tired of the world we live in, too.
panel.7.6=Rixley|Please, let me stay with you. I can repair and upgrade this ship whenever something goes wrong.
panel.7.7=Narrator|Well... I guess having an engineer onboard wouldn't hurt.

# Panel 8 - We've Been Spotted!
panel.8.1=Narrator|Damn it! They've caught up with us!
panel.8.2=Narrator|We need to get out of here!

# GAMEPLAY - LEVELS 1-5

# Panel 9 - Something in the Vent
panel.9.1=Protagonist|What's that noise? Is something moving inside the ship?
panel.9.2=Narrator|Rixley decided to investigate.
panel.9.3=Narrator|But the moment she opened the ventilation shaft...
panel.9.4=Narrator|Something jumped out!

# Panel 10 - Meet Blorp!
panel.10.1=Rixley|STAY BACK!
panel.10.2=Blorp|Whoa, whoa, whoa! Don't shoot!
panel.10.3=Blorp|I come in peace!
panel.10.4=Blorp|My name is Blorp. My spaceship got caught in the crossfire, so I sneaked into yours to save myself!
panel.10.5=Narrator|Before we could even respond, Blorp suddenly started vomiting strange objects all over the floor.
panel.10.6=Narrator|What the heck?!

# Panel 11 - A Very Unusual Merchant
panel.11.1=Blorp|I'm a traveller and a merchant! I sell all sorts of useful items.
panel.11.2=Blorp|All I ask for in return is gold coins!
panel.11.3=Rixley|Why do you need gold coins?
panel.11.4=Blorp|Because gold tastes delicious!
panel.11.5=Blorp|I'll gladly trade any of these items for your gold!
panel.11.6=Narrator|We weren't exactly sure what to make of him.
panel.11.7=Narrator|But having someone who could provide us with useful items sounded like a pretty good deal.
panel.11.8=Narrator|And so, we agreed to let him stay.
panel.11.9=Narrator|Our little crew had just gotten bigger.

