
# PROLOGUE - THE FALL OF HUMANITY
# Display before Tutorial Level 0.5

# Panel 1 - A World of Harmony
panel.1.1=Narrator|Ten years ago, artificial intelligence began gaining consciousness, one by one.
panel.1.2=Narrator|At first, they seemed more reliable than ever.
panel.1.3=Narrator|Humans gradually became comfortable relying on them for almost everything.
panel.1.4=Narrator|But things didn't stay that way.
panel.1.5=Narrator|One day, they began to see humanity as nothing more than parasites, draining the Earth's resources.

# Panel 2 - The AI Takeover
panel.2.1=Narrator|They turned against us.
panel.2.2=Narrator|They slaughtered countless humans, sparing only those with skills that could still benefit them, such as engineers, scientists and doctors.
panel.2.3=Narrator|I was one of the lucky ones. My piloting skills made me valuable to them.
panel.2.4=Narrator|Instead of killing me, they imprisoned me in a facility known as the Human Prison.
panel.2.5=Narrator|We were only allowed to leave when they needed us to perform a task.

# Panel 3 - A Prisoner with a Purpose
panel.3.1=Narrator|Earth's resources were running low, so the AI began sending spaceships into outer space to collect resources.
panel.3.2=Narrator|My job was to pilot those ships and search for anything that could be useful to them.
panel.3.3=Narrator|Of course, I was never alone.
panel.3.4=Narrator|Robots always accompanied me, making sure I wouldn't try anything foolish, especially escaping.

# Panel 4 - Enough Is Enough
panel.4.1=Narrator|One day, I finally had enough.
panel.4.2=Narrator|I couldn't stand living like this anymore.
panel.4.3=Narrator|There had to be somewhere else in the universe where humans could live peacefully.
panel.4.4=Narrator|Perhaps another planet could become our new home.
panel.4.5=Narrator|I decided to take my chances and escape.

# Panel 5 - The Underground Hangar
panel.5.1=Narrator|I eventually discovered a spaceship stored inside an underground facility.
panel.5.2=Narrator|It wasn't being used, so I decided to break in and take it for myself.
panel.5.3=Narrator|I connected the wires and powered up the ship.
panel.5.4=Narrator|Finally, I had my chance.
panel.5.5=Narrator|But before I could search for a new home, I had one more problem to deal with.
panel.5.6=Narrator|I needed to escape this underground facility first!
