name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -Xlint:all -d bin $(find src -name '*.java')

      - name: Check resources referenced by code exist
        run: test -f res/graphics && test -f res/scores

  # Smoke test:
  # Run the game on a virtual display.
  # Accept either the new Profile Selection screen
  # or the original Title Screen as a successful startup.
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          mkdir -p bin
          javac -d bin $(find src -name '*.java')

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Run the game for 10 seconds
        run: xvfb-run -a timeout 10 java -cp bin:res engine.Core > game.log 2>&1 || true

      - name: Check the log
        run: |
          cat game.log

          if grep -q "Exception" game.log; then
            echo "::error::The game threw an exception while starting. See the log above."
            exit 1
          fi

          if ! grep -Eq "Starting (profile selection|title) screen" game.log; then
            echo "::error::The game never reached a startup screen."
            exit 1
          fi

          echo "Reached the startup screen with no exceptions."

  # Unit tests:
  # Our tests in tests/ are plain Java programs (own main() and check() helper), not JUnit.
  # Compile them against the game classes and run each one. Any failing test fails this job.
  # If a test cannot run on the CI machine (for example it needs a sound device),
  # add its class name to EXCLUDE below and tell the team why.
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile game and tests
        run: |
          mkdir -p bin bin-tests
          javac -d bin $(find src -name '*.java')
          javac -cp bin -d bin-tests $(find tests -name '*.java')

      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Run every test
        run: |
          EXCLUDE=""
          failed=0
          for f in $(find tests -name '*Test.java' | sort); do
            cls=$(echo "${f#tests/}" | sed 's/\.java$//; s#/#.#g')
            if echo " $EXCLUDE " | grep -q " $cls "; then
              echo "SKIP $cls"
              continue
            fi
            echo "::group::$cls"
            if xvfb-run -a timeout 60 java -cp bin-tests:bin:res "$cls"; then
              echo "PASS $cls"
            else
              echo "::error::FAIL $cls"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed